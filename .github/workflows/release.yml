name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsodium
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium:x64-windows'

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure

      - name: Create portable package
        shell: pwsh
        run: cpack --config build-release/CPackConfig.cmake -B build-release

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" build-release/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: steelbox-windows-x64
          path: build-release/*.zip
